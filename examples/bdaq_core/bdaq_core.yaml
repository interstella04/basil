transfer_layer:
  - name  : intf
    type  : SiTcp
    init:
        ip : "192.168.10.16"
        udp_port : 4660
        tcp_port : 24
        tcp_connection : True

hw_drivers:
  - name      : OUT0
    type      : gpio
    interface : intf
    base_addr : 0x1040
    size      : 8

  - name      : OUT1
    type      : gpio
    interface : intf
    base_addr : 0x1080
    size      : 8

  - name      : IN0
    type      : gpio
    interface : intf
    base_addr : 0x1060
    size      : 8

  - name      : IN1
    type      : gpio
    interface : intf
    base_addr : 0x10a0
    size      : 8

  - name      : FIFO
    type      : sitcp_fifo
    interface : intf
    base_addr : 0x200000000
    base_data_addr : 0x100000000

registers:
  - name        : OUT0
    type        : StdRegister
    hw_driver   : OUT0
    size        : 8
    fields:
      - name    : TX
        size    : 2
        offset  : 1
      - name    : GPIO # GPIO1 and GPIO3
        size    : 2
        offset  : 3

  - name        : OUT1
    type        : StdRegister
    hw_driver   : OUT1
    size        : 32
    fields:
      - name    : CMOS # CMOS0 -CMOS10
        size    : 11
        offset  : 10
      - name    : LVDS_PN # LVDS_PN14 - LVDS_PN18
        size    : 5
        offset  : 11

  - name        : IN0
    type        : StdRegister
    hw_driver   : IN0
    size        : 8
    fields:
      - name    : RX
        size    : 2
        offset  : 1
      - name    : GPIO # GPIO0 and GPIO2
        size    : 2
        offset  : 3

  - name        : IN1
    type        : StdRegister
    hw_driver   : IN1
    size        : 32
    fields:
      - name    : CMOS # CMOS11 -CMOS21
        size    : 11
        offset  : 10
      - name    : LVDS_PN # LVDS_PN19 - LVDS_PN23
        size    : 5
        offset  : 11