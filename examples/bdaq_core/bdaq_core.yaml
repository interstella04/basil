transfer_layer:
  - name  : intf
    type  : SiTcp
    init:
        ip : "192.168.10.16"
        udp_port : 4660
        tcp_port : 24
        tcp_connection : True

hw_drivers:
  - name      : OUT0
    type      : gpio
    interface : intf
    base_addr : 0x1040
    size      : 8

  - name      : IN0
    type      : gpio
    interface : intf
    base_addr : 0x1060
    size      : 8

  - name      : FIFO
    type      : sitcp_fifo
    interface : intf
    base_addr : 0x200000000
    base_data_addr : 0x100000000

registers:
  - name        : OUT0
    type        : StdRegister
    hw_driver   : OUT0
    size        : 8
    fields:
      - name    : TX
        size    : 2
        offset  : 1
      - name    : GPIO_OUT
        size    : 2
        offset  : 3

  - name        : IN0
    type        : StdRegister
    hw_driver   : IN0
    size        : 8
    fields:
      - name    : RX
        size    : 2
        offset  : 1
      - name    : GPIO_IN
        size    : 2
        offset  : 3

