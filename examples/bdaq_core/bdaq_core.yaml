transfer_layer:
  - name  : intf
    type  : SiTcp
    init:
        ip : "192.168.10.16"
        udp_port : 4660
        tcp_port : 24
        tcp_connection : True

hw_drivers:
  - name      : OUT0
    type      : gpio
    interface : intf
    base_addr : 0x1040
    size      : 8

  - name      : OUT1
    type      : gpio
    interface : intf
    base_addr : 0x1080
    size      : 8

  - name      : IN0
    type      : gpio
    interface : intf
    base_addr : 0x1060
    size      : 8

  - name      : IN1
    type      : gpio
    interface : intf
    base_addr : 0x10a0
    size      : 8

  - name      : FIFO
    type      : sitcp_fifo
    interface : intf
    base_addr : 0x200000000
    base_data_addr : 0x100000000

registers:
  - name        : OUT0
    type        : StdRegister
    hw_driver   : OUT0
    size        : 8
    fields:
      - name    : TX0
        size    : 1
        offset  : 0
      - name    : TX1
        size    : 1
        offset  : 1
      - name    : GPIO1
        size    : 1
        offset  : 2
      - name    : GPIO3
        size    : 1
        offset  : 3

  - name        : OUT1
    type        : StdRegister
    hw_driver   : OUT1
    size        : 32
    fields:
      - name    : CMOS
        size    : 11
        offset  : 10

  - name        : IN0
    type        : StdRegister
    hw_driver   : IN0
    size        : 8
    fields:
      - name    : RX0
        size    : 1
        offset  : 0
      - name    : RX1
        size    : 1
        offset  : 1
      - name    : GPIO0
        size    : 1
        offset  : 2
      - name    : GPIO2
        size    : 1
        offset  : 3

  - name        : IN1
    type        : StdRegister
    hw_driver   : IN1
    size        : 32
    fields:
      - name    : CMOS
        size    : 11
        offset  : 10